# Publishes the package to npm when a GitHub release is published (`yarn release` creates it).
# Needs the repository secret NPM_TOKEN, an npm automation token with publish rights for @ronradtke.
name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use the npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/

      - name: Check
        run: |
          yarn lint
          yarn typecheck
          yarn test --maxWorkers=2

      - name: Build
        run: yarn prepare

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
